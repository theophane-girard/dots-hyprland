shell=fish
term=xterm-256color

title=foot

font=JetBrainsMono Nerd Font:size=11
letter-spacing=0
dpi-aware=no

pad=25x25

bold-text-in-bright=no

# Legere transparence du fond. `alpha` de foot ne touche QUE le fond : le
# texte reste opaque, contrairement a une regle `opacity` de Hyprland qui
# delave la fenetre entiere, glyphes compris. Le flou de Hyprland
# (decoration:blur:enabled = true) s'applique derriere.
#
# Declare dans les DEUX sections : foot 1.27 a deprecie `[colors]` (il warne
# et le traite comme `[colors-dark]` seul), et le choix entre dark et light
# depend de la preference de theme remontee par le compositeur. Mettre les
# deux garde la transparence dans les deux cas.
#
# Ce fichier n'est pas genere par matugen (cf. matugenGenerated dans
# /etc/nixos/home/illogical-impulse.nix), il survit donc aux switch -- mais il
# EST ecrase par la recopie end-4, d'ou son edition ici et pas dans ~/.config.
[colors-dark]
alpha=0.9

[colors-light]
alpha=0.9

[scrollback]
lines=10000
# Lignes defilees par cran de molette (defaut 3.0). Levier LOCAL a foot, que
# les autres applis ne voient pas : c'est lui qui permet d'harmoniser le
# terminal avec le reste sans toucher a `input:touchpad:scroll_factor`, qui
# est global et convient deja ailleurs.
# 21.0 = 3.0 x 7, la compensation exacte du passage de scroll_factor 0.7 -> 0.1
# (cf. hypr/hyprland/general.lua) : foot retrouve la vitesse qu'il avait avant,
# le navigateur garde la nouvelle. A reajuster ICI, pas dans scroll_factor.
multiplier=21.0

[cursor]
style=beam
blink=no
beam-thickness=1.5
# underline-thickness=<font underline thickness>

[key-bindings]
scrollback-up-page=Page_Up
scrollback-down-page=Page_Down
clipboard-copy=Control+c
clipboard-paste=Control+v
# primary-paste=Shift+Insert
search-start=Control+f
font-increase=Control+plus Control+equal Control+KP_Add
font-decrease=Control+minus Control+KP_Subtract
font-reset=Control+0 Control+KP_0

[search-bindings]
cancel=Escape
find-prev=Shift+F3
find-next=F3 Control+G
delete-prev-word=Control+BackSpace

[text-bindings]
\x03=Control+Shift+c
