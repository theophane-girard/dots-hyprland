# Pile PAM dediee au deverrouillage par empreinte de l'ecran de verrouillage II
# (LockContext.qml, PamContext "fingerPam").
#
# NixOS : le nom court "pam_fprintd.so" d'origine ne resout pas -- il n'existe
# pas de /lib/security global, chaque module vit dans son store path. On passe
# donc par /run/current-system/sw, qui pointe toujours sur la generation
# courante. Cela suppose fprintd dans environment.systemPackages
# (modules/desktop.nix) : services.fprintd.enable seul ne l'y met pas.
auth    sufficient    /run/current-system/sw/lib/security/pam_fprintd.so
