# Config de xdg-desktop-portal-hyprland (lue telle quelle depuis
# ~/.config/hypr/xdph.conf). Portee depuis le depot stow dotfiles-gh.
screencopy {
    # Coche "Allow a restore token" par defaut dans le picker de partage d'ecran.
    # -> plus besoin de cocher manuellement a chaque reunion
    # -> couvre la 2e session portal d'un meme partage quand l'app repasse le token
    allow_token_by_default = true

    # Chrome ne persiste AUCUN restore token (prefs display_media_* vides) et ouvre
    # 2 sessions portal par partage -> picker plusieurs fois pour un seul clic.
    # Le wrapper rejoue la derniere selection sans UI pendant 60 s (TTL dans le script).
    custom_picker_binary = /home/theophane/.config/hypr/custom/scripts/xdph-share-picker.sh
}
